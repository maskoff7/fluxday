name: Feature
description: A scoped product increment
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Product outcome
      description: What should become possible or clearer?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable criteria.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
